<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ad previews</title>
<!--
  Ad preview template. Replace the DATA array below with the campaign's ad groups.
  Self-contained: inline CSS/JS only, no external requests, no browser storage.
  Deliver with SendUserFile; persist with create_artifact if the user will revisit it.

  Purpose: let the user approve copy BEFORE any spend. Shuffle shows how Google
  rotates headline combinations, so they judge the mix rather than one fixed ad.
-->
<style>
  :root{
    --bg:#f6f7f9;--card:#fff;--ink:#1f2328;--muted:#5f6672;--line:#e3e6ea;
    --link:#1a0dab;--green:#0b8043;--accent:#1a73e8;
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#0e1116;--card:#171b21;--ink:#e6e9ee;--muted:#9aa3b0;--line:#262c35;
          --link:#8ab4f8;--green:#5bb974;--accent:#8ab4f8;}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .wrap{max-width:1080px;margin:0 auto;padding:32px 20px 72px}
  h1{font-size:26px;margin:0 0 6px;letter-spacing:-.01em}
  .sub{color:var(--muted);margin:0 0 22px}
  .tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
  .tab{padding:9px 16px;border:1px solid var(--line);background:var(--card);color:var(--muted);
    border-radius:999px;cursor:pointer;font:600 14px inherit;font-family:inherit}
  .tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  .controls{display:flex;gap:10px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
  button.act{background:var(--accent);color:#fff;border:0;padding:10px 18px;border-radius:8px;
    font:600 14px inherit;font-family:inherit;cursor:pointer}
  .note{color:var(--muted);font-size:13px}
  .serp{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 4px}
  .ad{padding:16px 18px;border-bottom:1px solid var(--line)}
  .ad:last-child{border-bottom:0}
  .badge{font-weight:700;font-size:12px}
  .urlrow{display:flex;align-items:center;gap:9px;margin:5px 0 3px}
  .fav{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#1a73e8,#5b3df5);
    color:#fff;display:grid;place-items:center;font:700 12px inherit;flex:none}
  .site{font-size:13px;line-height:1.25}
  .site b{display:block;font-weight:500}
  .site span{color:var(--muted)}
  .hl{color:var(--link);font-size:19px;line-height:1.3;margin:3px 0 4px}
  .ds{color:var(--muted);font-size:13.5px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px;margin-top:18px}
  h2{font-size:12px;margin:0 0 10px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);
    padding:8px 10px;border-bottom:1px solid var(--line)}
  td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  td.n{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
  .ok{color:var(--green);font-weight:600}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
</style>
</head>
<body>
<div class="wrap">
  <h1 id="title">Ad previews</h1>
  <p class="sub" id="subtitle">Campaign summary goes here</p>

  <div class="tabs" id="tabs" role="tablist"></div>
  <div class="controls">
    <button class="act" id="shuffle">Shuffle combinations</button>
    <span class="note">Google assembles these automatically — each impression is a different mix.</span>
  </div>

  <div class="serp" id="serp"></div>
  <div class="grid">
    <div class="card"><h2>Headlines</h2><table id="tblH"></table></div>
    <div class="card"><h2>Descriptions</h2><table id="tblD"></table></div>
  </div>
</div>

<script>
// ---- REPLACE FROM HERE ----
const BRAND   = "Brand";
const DOMAIN  = "example.com";
const PATH    = "path-one › path-two";
const SUMMARY = "Search campaign · United Kingdom · £50 total";
const DATA = [
  {
    name: "Ad group 1",
    headlines: ["Headline one","Headline two","Headline three"],
    descs: ["First description line.","Second description line."]
  }
];
// ---- REPLACE TO HERE ----

let g = 0, seed = 0;
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function combos(d, s){
  const H = d.headlines, D = d.descs, out = [];
  for (let i = 0; i < 3; i++){
    const picks = [];
    for (let j = 0; j < 3; j++) picks.push(H[(s + i * 3 + j * (i + 1)) % H.length]);
    out.push({ h: [...new Set(picks)].slice(0, 3), d: D[(s + i) % D.length] });
  }
  return out;
}

function render(){
  const d = DATA[g];
  document.getElementById('subtitle').textContent = SUMMARY;
  document.getElementById('tabs').innerHTML = DATA.map((x, i) =>
    `<button class="tab" role="tab" aria-selected="${i === g}" data-g="${i}">${esc(x.name)}</button>`).join('');
  document.querySelectorAll('.tab').forEach(t =>
    t.onclick = () => { g = +t.dataset.g; render(); });

  document.getElementById('serp').innerHTML = combos(d, seed).map(c => `
    <div class="ad">
      <div class="badge">Sponsored</div>
      <div class="urlrow">
        <div class="fav">${esc(BRAND[0] || '?')}</div>
        <div class="site"><b>${esc(BRAND)}</b><span>https://${esc(DOMAIN)} › ${esc(PATH)}</span></div>
      </div>
      <div class="hl">${c.h.map(esc).join(' | ')}</div>
      <div class="ds">${esc(c.d)}</div>
    </div>`).join('');

  document.getElementById('tblH').innerHTML =
    '<tr><th>Headline</th><th style="text-align:right">Chars</th></tr>' +
    d.headlines.map(h => `<tr><td>${esc(h)}</td><td class="n">${h.length}${
      h.length <= 30 ? '<span class="ok"> ✓</span>' : ' ✗'}</td></tr>`).join('');

  document.getElementById('tblD').innerHTML =
    '<tr><th>Description</th><th style="text-align:right">Chars</th></tr>' +
    d.descs.map(x => `<tr><td>${esc(x)}</td><td class="n">${x.length}${
      x.length <= 90 ? '<span class="ok"> ✓</span>' : ' ✗'}</td></tr>`).join('');
}

document.getElementById('shuffle').onclick = () => { seed = (seed + 1) % 97; render(); };
render();
</script>
</body>
</html>
